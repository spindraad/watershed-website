apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Values.app.namespace }}
  labels:
    app: {{ .Values.service.name }}
    component: {{ .Values.service.name }}
    managed-by: helm
    environment: {{ .Values.environment }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.app.name }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.name }}-postgresql-service
  namespace: {{ .Values.app.namespace }}
spec:
    selector:
      app: {{ .Values.app.name }}-postgresql
    ports:
      - protocol: TCP
        port: 5432
        targetPort: 5432
        name: postgresql
